{% extends "base.html" %}

{% block title %}Archiwizuj nawyk · HabitCoach AI{% endblock %}

{% block content %}
<div class="card">
    <h1 class="text-2xl font-bold tracking-tight mb-4">Archiwizuj nawyk</h1>

    <p class="text-gray-700 mb-6">
        Czy na pewno chcesz zarchiwizować "<strong>{{ habit.name }}</strong>"?
        Historia wykonań zostanie zachowana, ale nawyk zniknie z listy aktywnych.
    </p>

    <form method="post" class="flex items-center gap-4">
        {% csrf_token %}
        <button type="submit" class="inline-flex items-center justify-center gap-2 bg-red-600 text-white font-medium px-5 py-2.5 rounded-lg shadow-sm transition hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
            Archiwizuj
        </button>
        <a href="{% url 'accounts:dashboard' %}" class="text-sm text-gray-600 hover:text-gray-900">Anuluj</a>
    </form>
</div>
{% endblock %}
