<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HabitCoach AI{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-900 antialiased"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <div class="{% block container_width %}max-w-md{% endblock %} mx-auto pt-12 px-4 pb-12">
        <header class="mb-8 flex items-center justify-between gap-4">
            <a href="{% url 'accounts:dashboard' %}" class="text-2xl font-bold text-indigo-600 hover:text-indigo-700">
                HabitCoach AI
            </a>
            {% if user.is_authenticated %}
                <div class="flex items-center gap-3 text-sm">
                    <span class="text-gray-500 truncate max-w-[10rem]">{{ user.email }}</span>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="text-gray-500 hover:text-indigo-600 hover:underline">
                            Wyloguj
                        </button>
                    </form>
                </div>
            {% endif %}
        </header>

        {% if messages %}
            <div class="mb-4 space-y-2">
                {% for message in messages %}
                    <div class="px-4 py-2 rounded bg-blue-50 text-blue-700 text-sm">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
