<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HabitCoach AI{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-900 antialiased">
    <div class="max-w-md mx-auto pt-12 px-4 pb-12">
        <header class="mb-8">
            <a href="{% url 'accounts:dashboard' %}" class="text-2xl font-bold text-indigo-600 hover:text-indigo-700">
                HabitCoach AI
            </a>
        </header>

        {% if messages %}
            <div class="mb-4 space-y-2">
                {% for message in messages %}
                    <div class="px-4 py-2 rounded bg-blue-50 text-blue-700 text-sm">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
