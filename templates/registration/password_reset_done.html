{% extends "base.html" %}

{% block title %}Link wysłany · HabitCoach AI{% endblock %}

{% block content %}
<div class="card">
    <span class="mb-4 inline-flex h-12 w-12 items-center justify-center rounded-full bg-indigo-50 text-indigo-600">
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
    </span>
    <h1 class="text-2xl font-bold tracking-tight mb-4">Sprawdź skrzynkę</h1>
    <p class="text-gray-700 mb-6">
        Jeśli istnieje konto z podanym adresem, wysłaliśmy na nie link do resetu hasła.
        Sprawdź skrzynkę odbiorczą oraz folder spam.
    </p>
    <a href="{% url 'login' %}" class="link">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Wróć do logowania
    </a>
</div>
{% endblock %}
